name: Release

on:
  push:
    branches:
      - main

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  actions: write
  contents: write
  pull-requests: write

jobs:
  verify:
    uses: ./.github/workflows/_verify.yml
    with:
      node-versions: '["24"]'

  release:
    needs: verify
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm

      - run: npm ci

      - name: Configure git author
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

      - name: Create release pull request or publish release
        id: changesets
        uses: changesets/action@v1
        with:
          createGithubReleases: false
          version: npm run changeset:version
          publish: npm run release:publish
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Read release metadata
        id: release-meta
        run: |
          if [ -f .release.json ]; then
            {
              echo "created=true"
              echo "tag=$(node -e "const fs=require('node:fs');const data=JSON.parse(fs.readFileSync('.release.json','utf8'));process.stdout.write(data.tag);")"
              echo "is_latest=$(node -e "const fs=require('node:fs');const data=JSON.parse(fs.readFileSync('.release.json','utf8'));process.stdout.write(String(Boolean(data.isLatestRelease)));")"
            } >> "$GITHUB_OUTPUT"
          else
            echo "created=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Update badges on main for latest release
        if: steps.release-meta.outputs.created == 'true' && steps.release-meta.outputs.is_latest == 'true'
        env:
          RELEASE_TAG: ${{ steps.release-meta.outputs.tag }}
        run: |
          if [ -z "$(git status --porcelain -- badges README.md)" ]; then
            echo "No badge changes to commit."
            exit 0
          fi

          git add badges README.md
          git commit -m "chore: update badges for ${RELEASE_TAG} [skip ci]"
          git push origin HEAD:main

      - name: Generate release notes from changelog
        if: steps.release-meta.outputs.created == 'true'
        run: node ./script/generate-release-notes.mjs

      - name: Create GitHub release
        if: steps.release-meta.outputs.created == 'true'
        uses: softprops/action-gh-release@v3
        with:
          tag_name: ${{ steps.release-meta.outputs.tag }}
          target_commitish: action-release
          body_path: .release-notes.md
