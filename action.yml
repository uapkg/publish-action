name: uapkg Publish Action
description: Publish an existing UAPKG package through GitHub Actions trusted publishing
author: uapkg

branding:
  icon: upload-cloud
  color: blue

inputs:
  registry-id:
    description: Canonical UUID of the target UAPKG registry
    required: true
  manifest-path:
    description: Repository-relative path to the uapkg manifest
    required: false
    default: uapkg.json
  release-tag:
    description: GitHub Release tag to publish (defaults to the release event, tag ref, or v<manifest version>)
    required: false
  asset:
    description: Name of the package asset attached to the GitHub Release
    required: false
    default: package.tgz
  detach:
    description: Return after submission instead of waiting for a terminal result
    required: false
    default: "false"

outputs:
  request-id:
    description: UAPKG registry request identifier
  request-status:
    description: Last observed UAPKG registry request status
  package-name:
    description: Package name read from uapkg.json
  package-version:
    description: Package version read from uapkg.json
  package-source:
    description: GitHub source repository in owner/name form
  release-tag:
    description: Resolved GitHub Release tag

runs:
  using: node24
  main: dist/index.js
